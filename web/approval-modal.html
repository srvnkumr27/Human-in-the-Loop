<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Approval Request</title>
  <style>
    body { font-family: system-ui, Arial; padding: 1rem; }
    .card { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; max-width: 800px; }
    .meta { color: #555; font-size: .9rem; margin-bottom: .5rem; }
    .buttons { margin-top: 1rem; display:flex; gap:.5rem; }
    button { padding: .5rem 1rem; border: none; border-radius: 6px; cursor:pointer; }
    .approve { background:#07804a; color:white; }
    .deny { background:#c02f1d; color:white; }
    textarea { width:100%; min-height:80px; margin-top:.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="title">Approve action</h2>
    <div class="meta" id="meta">Loading...</div>
    <div id="details"></div>

    <label for="comment">Comment (required for deny/approve):</label>
    <textarea id="comment" placeholder="Add context or conditions..."></textarea>

    <div class="buttons">
      <button class="deny" id="denyBtn">Deny</button>
      <button class="approve" id="approveBtn">Approve</button>
    </div>

    <div id="status" style="margin-top:1rem;color:#555;font-size:.9rem;"></div>
  </div>

  <script>
    async function loadApproval(id) {
      const resp = await fetch('/api/approvals/' + id);
      if (!resp.ok) {
        document.getElementById('meta').textContent = 'Approval not found.';
        return;
      }
      const rec = await resp.json();
      document.getElementById('meta').textContent = `Requested by ${rec.requester} · rule: ${rec.ruleId} · state: ${rec.state}`;
      document.getElementById('details').innerHTML = `
        <p><strong>Action:</strong> ${rec.action?.actionType || ''}</p>
        <pre style="background:#f7f7f7;padding:.5rem;border-radius:6px;">${JSON.stringify(rec.action, null, 2)}</pre>
      `;
    }

    async function postDecision(id, decision) {
      const comment = document.getElementById('comment').value;
      const resp = await fetch('/api/approvals/' + id + '/decision', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ decision, approver: 'alice@example.com', comment })
      });
      const result = await resp.json();
      if (!resp.ok) {
        document.getElementById('status').textContent = result.error || 'Error';
        return;
      }
      document.getElementById('status').textContent = decision === 'approve' ? 'Approved. Agent will continue.' : 'Denied. Agent will abort.';
    }

    document.getElementById('approveBtn').addEventListener('click', async () => {
      const id = new URLSearchParams(location.search).get('id');
      await postDecision(id, 'approve');
    });

    document.getElementById('denyBtn').addEventListener('click', async () => {
      const id = new URLSearchParams(location.search).get('id');
      await postDecision(id, 'deny');
    });

    const id = new URLSearchParams(location.search).get('id');
    if (id) loadApproval(id);
  </script>
</body>
</html>
